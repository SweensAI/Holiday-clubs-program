<style>
  :root{
    --paper:#F6EFE0;
    --paper-deep:#EFE4CC;
    --ink:#2A2620;
    --ink-soft:#6b6255;
    --line:#C9A24B;
    --jacob:#2B6CB0;
    --jacob-soft:#DCE9F7;
    --noah:#2F855A;
    --noah-soft:#DFF0E4;
    --family:#C0392B;
    --family-soft:#F6DAD5;
    --maybe:#B54834;
    --maybe-soft:#F6DDD4;
    --card:#FFFDF7;
    --shadow: 0 6px 18px rgba(42,38,32,0.10);
    --radius: 16px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Work Sans', sans-serif; -webkit-font-smoothing:antialiased;}
  body{
    padding-bottom: 40px;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(42,38,32,0.05) 1px, transparent 0);
    background-size: 18px 18px;
  }

  .display{ font-family:'Caveat', cursive; }

  header.top{
    position: sticky; top:0; z-index:20;
    background: var(--paper);
    padding: 18px 18px 0 18px;
    border-bottom: 3px solid var(--line);
  }
  header.top .title-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    margin-bottom: 10px;
  }
  header.top h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 2.1rem;
    margin: 0;
    line-height: 1;
  }
  header.top .dates{
    font-size: 0.72rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    white-space: nowrap;
  }

  .legend{
    display:flex; gap:14px; padding: 2px 0 12px 0; font-size:0.72rem; color:var(--ink-soft); font-weight:600;
  }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }

  .child-filter{ display:flex; gap:6px; padding-bottom:10px; }
  .filter-btn{
    font-family:'Work Sans', sans-serif; font-weight:700; font-size:0.74rem;
    border:1px solid rgba(42,38,32,0.15); background:var(--card); color:var(--ink-soft);
    padding:5px 12px; border-radius:20px; cursor:pointer;
  }
  .filter-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .filter-btn.filter-jacob.active{ background:var(--jacob); border-color:var(--jacob); }
  .filter-btn.filter-noah.active{ background:var(--noah); border-color:var(--noah); }

  .next-up{
    display:none;
    max-width:640px; margin:12px auto 0 auto; padding: 0 16px;
  }
  .next-up.show{ display:block; }
  .next-up .inner{
    display:flex; align-items:center; gap:10px;
    background: var(--ink); color: var(--paper);
    border-radius: 14px; padding: 12px 14px; cursor:pointer;
  }
  .next-up .emoji{ font-size:1.3rem; }
  .next-up .label{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.06em; opacity:0.7; font-weight:700; }
  .next-up .t{ font-size:0.9rem; font-weight:700; }
  .next-up .m{ font-size:0.72rem; opacity:0.8; }

  .day.is-today{ outline: 2px solid var(--maybe); outline-offset:-1px; }
  .day.is-today .day-head{ background: var(--maybe-soft); }
  .day.is-today .num::after{
    content:'TODAY'; display:block; font-family:'Work Sans', sans-serif; font-weight:700;
    font-size:0.5rem; letter-spacing:0.05em; color: var(--maybe); margin-top:2px;
  }

  .chip.is-booked{ opacity: 0.55; }
  .chip.is-booked .t::after{ content:' ✓'; color: var(--noah); }
  .booked-toggle{
    display:flex; align-items:center; gap:8px; margin-top:16px; padding:10px 12px;
    background: var(--paper-deep); border-radius:12px; font-size:0.85rem; font-weight:600; cursor:pointer;
  }
  .booked-toggle .box{
    width:20px; height:20px; border-radius:6px; border:2px solid var(--ink-soft); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:0.8rem; color:var(--paper);
  }
  .booked-toggle.checked .box{ background:var(--noah); border-color:var(--noah); }

  nav.tabs{
    display:flex;
    gap: 4px;
    overflow-x:auto;
    -ms-overflow-style: none;
    scrollbar-width:none;
    padding-bottom:0;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size: 0.86rem;
    letter-spacing:0.01em;
    color: var(--ink-soft);
    background: var(--paper-deep);
    border: none;
    padding: 10px 18px 12px 18px;
    cursor:pointer;
    white-space:nowrap;
    border-radius: 10px 10px 0 0;
    clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
    margin-right: -6px;
    transition: background .15s ease, color .15s ease, transform .15s ease;
  }
  nav.tabs button.active{
    background: var(--card);
    color: var(--ink);
    transform: translateY(-2px);
    box-shadow: 0 -2px 10px rgba(42,38,32,0.08);
  }

  main{ padding: 16px; max-width: 640px; margin: 0 auto; }
  .panel{ display:none; animation: fade .25s ease; }
  .panel.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .day{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow:hidden;
    border: 1px solid rgba(42,38,32,0.06);
  }
  .day.empty{ opacity: 0.55; }
  .day-head{
    display:flex; align-items:center; gap:10px;
    padding: 10px 14px;
    background: var(--paper-deep);
    border-bottom: 1px solid rgba(42,38,32,0.08);
  }
  .day-head .num{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 1.7rem;
    line-height:1;
    color: var(--ink);
    min-width: 30px;
  }
  .day-head .names{ display:flex; flex-direction:column; line-height:1.15; }
  .day-head .dow{ font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color: var(--ink-soft); }
  .day-head .full{ font-size: 0.68rem; color: var(--ink-soft); opacity:0.8; }

  .activities{ padding: 10px 12px 12px 12px; display:flex; flex-direction:column; gap:8px; }
  .empty-note{ padding: 12px 14px; font-size:0.85rem; color: var(--ink-soft); font-style:italic; }

  .chip{
    display:flex; align-items:center; gap:10px;
    width:100%;
    text-align:left;
    background: var(--jacob-soft);
    border: none;
    border-left: 5px solid var(--jacob);
    border-radius: 10px;
    padding: 9px 12px;
    font-family:'Work Sans', sans-serif;
    cursor:pointer;
    transition: transform .1s ease;
  }
  .chip:active{ transform: scale(0.98); }
  .chip.who-noah{ background: var(--noah-soft); border-left-color: var(--noah); }
  .chip.who-both{ background: linear-gradient(90deg, var(--jacob-soft) 50%, var(--noah-soft) 50%); border-left-color: var(--jacob); }
  .chip.who-family{ background: var(--family-soft); border-left-color: var(--family); }
  .chip.status-maybe{ border-left-color: var(--maybe); }
  .chip.idea-chip{ background: var(--paper-deep); border-left-color: var(--line); }
  .chip .emoji{ font-size:1.15rem; line-height:1; }
  .chip .info{ flex:1; min-width:0; }
  .chip .info .t{ font-weight:600; font-size:0.92rem; color: var(--ink); display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .chip .info .m{ font-size:0.74rem; color: var(--ink-soft); margin-top:1px; }
  .tag{
    font-size: 0.6rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    padding: 1px 6px; border-radius: 20px; background: var(--maybe); color:#fff;
  }
  .chip .price{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color: var(--ink-soft); white-space:nowrap; }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background: rgba(20,17,10,0.45); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background: var(--card); width:100%; max-width: 640px;
    border-radius: 22px 22px 0 0; padding: 22px 22px 28px 22px;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.25);
    animation: rise .22s ease;
    max-height: 82vh; overflow-y:auto;
  }
  @keyframes rise{ from{ transform:translateY(24px); opacity:0.4; } to{ transform:translateY(0); opacity:1; } }
  .sheet .handle{ width:40px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 16px auto; }
  .sheet h2{ font-family:'Caveat', cursive; font-size:1.9rem; margin:0 0 2px 0; display:flex; align-items:center; gap:8px;}
  .sheet .sub{ font-size:0.8rem; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:14px;}
  .sheet dl{ margin:0; }
  .sheet .row{ display:flex; gap:10px; padding: 9px 0; border-bottom: 1px dashed rgba(42,38,32,0.15); }
  .sheet .row:last-of-type{ border-bottom:none; }
  .sheet .row dt{ width: 86px; flex-shrink:0; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color: var(--ink-soft); }
  .sheet .row dd{ margin:0; font-size:0.92rem; }
  .sheet .who-badges{ display:flex; gap:6px; }

const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let childFilter = 'all';

function localDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function getBookedMap(){
  try { return JSON.parse(localStorage.getItem('bookedMap')||'{}'); } catch(e){ return {}; }
}
function isBooked(id){ return !!getBookedMap()[id]; }
function setBooked(id, val){
  const map = getBookedMap();
  if(val) map[id]=true; else delete map[id];
  try { localStorage.setItem('bookedMap', JSON.stringify(map)); } catch(e){}
}

const FILLER_IDS = new Set(['w1-note','w2-note','w3-nothing']);

function getActivityDateTime(a){
  const startMin = parseStartMinutes(a.time);
  const base = new Date(a.date+'T00:00:00');
  if(startMin) base.setMinutes(startMin);
  return base;
}

function whoBadges(who){
  if(who==='both') return '<span class="badge jacob">Jacob</span><span class="badge noah">Noah</span>';
  if(who==='jacob') return '<span class="badge jacob">Jacob</span>';
  if(who==='noah') return '<span class="badge noah">Noah</span>';
  return '<span class="badge family">Note / other</span>';
}

function chipClass(a){
  let c = 'chip who-'+a.who;
  if(a.status==='maybe') c += ' status-maybe';
  return c;
}

function buildDayRange(week){
  const starts = {1:'2026-08-10', 2:'2026-08-17', 3:'2026-08-24'};
  const start = new Date(starts[week]+'T00:00:00');
  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function matchesFilter(a){
  if(childFilter==='all') return true;
  if(a.who==='family') return true;
  if(childFilter==='jacob') return a.who==='jacob'||a.who==='both';
  if(childFilter==='noah') return a.who==='noah'||a.who==='both';
  return true;
}

function renderWeek(week){
  const container = document.getElementById('week'+week);
  const days = buildDayRange(week);
  const todayStr = localDateStr(new Date());
  let html = '';
  days.forEach(dateStr=>{
    const dayActs = ACTIVITIES.filter(a=>a.date===dateStr && matchesFilter(a))
      .sort((a,b)=>{
        // sort by parsed start time when present, else keep insertion order (notes/all-day first)
        const ta = parseStartMinutes(a.time);
        const tb = parseStartMinutes(b.time);
        if(ta===null && tb===null) return 0;
        if(ta===null) return -1;
        if(tb===null) return 1;
        return ta-tb;
      });
    const d = new Date(dateStr+'T00:00:00');
    const dow = DOW[d.getDay()];
    const dowFull = DOW_FULL[d.getDay()];
    const dayNum = d.getDate();
    const isToday = dateStr===todayStr;

    html += `<div class="day ${dayActs.length===0?'empty':''} ${isToday?'is-today':''}">
      <div class="day-head">
        <div class="num">${dayNum}</div>
        <div class="names"><div class="dow">${dowFull}</div><div class="full">${dow} · Aug</div></div>
      </div>
      <div class="activities">`;

    if(dayActs.length===0){
      html += `<div class="empty-note">Nothing scheduled${childFilter!=='all'?' for this filter':' yet'}.</div>`;
    } else {
      dayActs.forEach(a=>{
        const booked = isBooked(a.id);
        html += `<button class="${chipClass(a)}${booked?' is-booked':''}" data-id="${a.id}">
          <span class="emoji">${a.emoji}</span>
          <span class="info">
            <span class="t">${a.title}${a.status==='maybe'?'<span class="tag">Maybe</span>':''}</span>
            <span class="m">${a.time?a.time+' · ':''}${a.location?a.location:(a.notes?truncate(a.notes,38):'')}</span>
          </span>
          <span class="price">${a.cost?shortCost(a.cost):''}</span>
        </button>`;
      });
    }
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

function truncate(s,n){ return s.length>n? s.slice(0,n-1)+'…' : s; }
function shortCost(c){
  const m = c.match(/£\d+/);
  return m? m[0] : (c==='Cost TBC'||c==='TBC'||c==='Cost TBC (SEGC)' ? 'TBC' : '');
}
function parseStartMinutes(t){
  if(!t) return null;
  const m = t.match(/(\d{1,2}):?(\d{2})?\s*(am|pm)/i);
  if(!m) return 0; // "Free morning" / "Check times" etc sort near top
  let h = parseInt(m[1],10);
  const min = m[2]?parseInt(m[2],10):0;
  const ap = m[3].toLowerCase();
  if(ap==='pm' && h!==12) h+=12;
  if(ap==='am' && h===12) h=0;
  return h*60+min;
}

  const d = new Date(a.date+'T00:00:00');
  const dateLabel = `${DOW_FULL[d.getDay()]} ${d.getDate()} August`;
  let rows = '';
  rows += `<div class="row"><dt>Who</dt><dd class="who-badges">${whoBadges(a.who)}</dd></div>`;
  rows += `<div class="row"><dt>Date</dt><dd>${dateLabel}</dd></div>`;
  if(a.time) rows += `<div class="row"><dt>Time</dt><dd>${a.time}</dd></div>`;
  if(a.location) rows += `<div class="row"><dt>Where</dt><dd>${a.location}</dd></div>`;
  if(a.cost) rows += `<div class="row"><dt>Cost</dt><dd>${a.cost}</dd></div>`;
  if(a.notes) rows += `<div class="row"><dt>Notes</dt><dd>${a.notes}</dd></div>`;

  let actions = `<div class="actions">`;
  if(a.link){
    actions += `<a class="btn-primary" href="${a.link}" target="_blank" rel="noopener">Visit website ↗</a>`;
  }
  actions += `<button class="btn-secondary ics-btn" data-id="${a.id}">＋ Calendar</button>`;
  actions += `</div>`;
  if(!a.link){
    actions += `<div class="no-link-note">No website link saved for this one yet — tell Claude the link and it'll be added here.</div>`;

function strictTimeMinutes(str){
  if(!str) return null;
  const m = str.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const min = m[2]?parseInt(m[2],10):0;
  const ap = m[3].toLowerCase();
  if(ap==='pm' && h!==12) h+=12;
  if(ap==='am' && h===12) h=0;
  return h*60+min;
}

function parseICSRange(t){
  if(!t) return null;
  const parts = t.split(/–|-/).map(s=>s.trim());
  if(parts.length===2){
    let [left,right] = parts;
    if(!/am|pm/i.test(left)){
      const rm = right.match(/am|pm/i);
      if(rm) left += rm[0];
    }
    const s = strictTimeMinutes(left);
    const e = strictTimeMinutes(right);
    if(s!==null && e!==null) return {startMin:s, endMin:e};
  }
  const single = strictTimeMinutes(t);
  if(single!==null) return {startMin:single, endMin:single+60};
  return null;
}

function downloadICS(a){
  const range = parseICSRange(a.time);
  const dateDigits = a.date.replace(/-/g,'');
  let dtLines;
  if(range){
    const sH = String(Math.floor(range.startMin/60)).padStart(2,'0');
    const sM = String(range.startMin%60).padStart(2,'0');
    const eH = String(Math.floor(range.endMin/60)).padStart(2,'0');
    const eM = String(range.endMin%60).padStart(2,'0');
    dtLines = `DTSTART:${dateDigits}T${sH}${sM}00\r\nDTEND:${dateDigits}T${eH}${eM}00`;
  } else {
    const next = new Date(a.date+'T00:00:00');
    next.setDate(next.getDate()+1);
    const nextDigits = localDateStr(next).replace(/-/g,'');
    dtLines = `DTSTART;VALUE=DATE:${dateDigits}\r\nDTEND;VALUE=DATE:${nextDigits}`;
  }
  const descParts = [a.cost, a.notes].filter(Boolean);
  const desc = descParts.join(' — ').replace(/\r?\n/g,' ');
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Summer Roster//EN','BEGIN:VEVENT',
    `UID:${a.id}@jacobnoahsummer2026`,
    dtLines,
    `SUMMARY:${(a.title||'Activity').replace(/\r?\n/g,' ')}`,
  ];
  if(a.location) lines.push(`LOCATION:${a.location.replace(/\r?\n/g,' ')}`);
  if(desc) lines.push(`DESCRIPTION:${desc}`);
  lines.push('END:VEVENT','END:VCALENDAR');
  const ics = lines.join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = (a.title||'activity').replace(/[^a-z0-9]+/gi,'_') + '.ics';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

  const tabBtn = document.querySelector(`nav.tabs button[data-tab="week${week}"]`);

  document.getElementById('week'+week).classList.add('active');
}
